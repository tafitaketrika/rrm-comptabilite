<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion – Le Fourmi / RRM Antsirabe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .login-card {
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .logo-img {
            max-width: 180px;
            height: auto;
            margin-bottom: 1.5rem;
        }
        .form-control {
            background: #1a1a1a;
            border: 1px solid #444;
            color: #fff;
        }
        .form-control:focus {
            background: #1a1a1a;
            border-color: #fff;
            color: #fff;
            box-shadow: 0 0 0 0.2rem rgba(255,255,255,0.15);
        }
        .form-label { color: #ccc; }
        .btn-login {
            background: #fff;
            color: #000;
            font-weight: 600;
            border: none;
            padding: 0.75rem;
        }
        .btn-login:hover {
            background: #e0e0e0;
            color: #000;
        }
        .alert { font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <img src="{{ url_for('static', filename='logo_le_fourmi.jpg') }}" alt="Le Fourmi" class="logo-img">
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} text-start">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST" class="text-start mt-3">
            <div class="mb-3">
                <label class="form-label">Identifiant</label>
                <input type="text" name="username" class="form-control form-control-lg" required autofocus placeholder="Identifiant">
            </div>
            <div class="mb-4">
                <label class="form-label">Mot de passe</label>
                <input type="password" name="password" class="form-control form-control-lg" required placeholder="Mot de passe">
            </div>
            <button type="submit" class="btn btn-login btn-lg w-100">
                Se connecter
            </button>
        </form>
    </div>
</body>
</html>
