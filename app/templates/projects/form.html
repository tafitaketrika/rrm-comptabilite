{% extends "base.html" %}
{% block title %}{% if project %}Modifier le projet{% else %}Nouveau projet{% endif %} – La Fourmi{% endblock %}
{% block content %}
<h2 class="page-title mb-4">
    <i class="bi bi-kanban"></i>
    {% if project %}Modifier le projet{% else %}Nouveau projet{% endif %}
</h2>
<form method="POST">
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nom</label>
                    <input type="text" name="name" class="form-control" required value="{{ project.name if project else '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Site</label>
                    <select name="site_id" class="form-select" required>
                        <option value="">— Choisir —</option>
                        {% for s in sites %}
                        <option value="{{ s.id }}" {% if project and project.site_id == s.id %}selected{% endif %}>{{ s.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-12">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="2">{{ project.description if project else '' }}</textarea>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Début</label>
                    <input type="text" name="start_date" class="form-control date-mask" maxlength="8"
                           value="{{ project.start_date.strftime('%d/%m/%y') if project and project.start_date else '' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Fin</label>
                    <input type="text" name="end_date" class="form-control date-mask" maxlength="8"
                           value="{{ project.end_date.strftime('%d/%m/%y') if project and project.end_date else '' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Statut</label>
                    <select name="status" class="form-select">
                        {% for k, v in {'planifie':'Planifié','en_cours':'En cours','clos':'Clos'}.items() %}
                        <option value="{{ k }}" {% if project and project.status == k %}selected{% endif %}>{{ v }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Responsable</label>
                    <select name="responsible_id" class="form-select">
                        <option value="">—</option>
                        {% for u in users %}
                        <option value="{{ u.id }}" {% if project and project.responsible_id == u.id %}selected{% endif %}>{{ u.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>
    </div>
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a href="{{ url_for('projects.list_projects') }}" class="btn btn-outline-secondary">Annuler</a>
    </div>
</form>
{% endblock %}
{% block extra_js %}
<script>
document.querySelectorAll('.date-mask').forEach(function(el) {
  el.addEventListener('input', function() {
    let v = this.value.replace(/\D/g, '').slice(0, 6);
    let out = v.slice(0, 2);
    if (v.length >= 3) out += '/' + v.slice(2, 4);
    if (v.length >= 5) out += '/' + v.slice(4, 6);
    this.value = out;
  });
});
</script>
{% endblock %}
