{% extends "base.html" %}
{% block title %}Sites – Projets{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="page-title mb-0"><i class="bi bi-geo-alt"></i> Sites</h2>
  <a href="{{ url_for('projects.list_boards') }}" class="btn btn-outline-secondary btn-sm">← Tableaux</a>
</div>
<div class="row g-3">
  <div class="col-md-5">
    <div class="card">
      <div class="card-header bg-dark text-white">Nouveau site</div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-2">
            <label class="form-label">Nom</label>
            <input type="text" name="name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Code</label>
            <input type="text" name="code" class="form-control">
          </div>
          <button type="submit" class="btn btn-primary btn-sm">Enregistrer</button>
        </form>
      </div>
    </div>
  </div>
  <div class="col-md-7">
    <div class="card">
      <div class="card-body p-0">
        <table class="table mb-0">
          <thead><tr><th>Nom</th><th>Code</th></tr></thead>
          <tbody>
            {% for s in sites %}
            <tr><td>{{ s.name }}</td><td>{{ s.code or '—' }}</td></tr>
            {% else %}
            <tr><td colspan="2" class="text-muted text-center py-3">Aucun site</td></tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
